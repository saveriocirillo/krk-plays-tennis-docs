# Vale configuration. Google developer style is the base; the KRK style adds
# the project's own rules. Run `vale sync` once to download the Google package.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = KRK
Packages = Google

[*.{md,mdx}]
BasedOnStyles = Vale, Google, KRK

# KRK.Headings replaces Google.Headings, with exceptions for this project's names.
Google.Headings = NO

# The README is Saverio's own account of how the portal is made, so it's written
# in the first person. The docs pages stay in the second person.
[README.md]
Google.FirstPerson = NO
Google.We = NO
# In the README, colons introduce lists of tools, which start with proper nouns.
Google.Colons = NO
